<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NTI Secure Admin CMS</title>
    <style>
        :root {
            --bg-color: #05070a;
            --accent-gold: #f3e5ab;
            --accent-gold-dark: #d4af37;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 11pt;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.6;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--accent-gold-dark);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 16pt;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .subtitle {
            font-size: 8.5pt;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 9.5pt;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            font-family: "Times New Roman", Times, serif;
            font-size: 11pt;
            border: 1px solid var(--border-color);
            background: rgba(15, 22, 36, 0.8);
            color: var(--text-main);
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-gold-dark);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .btn-publish {
            background: linear-gradient(135deg, var(--accent-gold-dark), #aa8c2c);
            color: #05070a;
            padding: 14px 20px;
            border: none;
            font-family: "Times New Roman", Times, serif;
            font-size: 11pt;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            letter-spacing: 2px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .archive-section {
            margin-top: 40px;
            border-top: 2px solid var(--border-color);
            padding-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(15, 22, 36, 0.5);
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
            font-size: 10pt;
        }

        th {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btns button {
            padding: 5px 10px;
            font-size: 9pt;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-family: "Times New Roman", Times, serif;
            margin-right: 5px;
        }
        
        .btn-edit { background: rgba(58, 134, 255, 0.2); border: 1px solid #3a86ff; color: #93c5fd; }
        .btn-delete { background: rgba(255, 65, 108, 0.2); border: 1px solid #ff416c; color: #fca5a5; }
        
        .top-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-home {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 9.5pt;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 4px;
            background: rgba(15, 22, 36, 0.5);
        }
    </style>
</head>
<body>
    <div class="top-links">
        <a href="/" class="back-home">← Return to Public Hub</a>
    </div>

    <header>
        <h1>NTI Secure Admin CMS</h1>
        <div class="subtitle">Restricted Access • Authorized NTI-ETL Command Only</div>
    </header>

    <main>
        <form id="cmsForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="docId">
            <div class="form-group">
                <label>Document Title</label>
                <input type="text" id="docTitle" placeholder="Enter unique title..." required>
            </div>

            <div class="form-group">
                <label>Topic / Category</label>
                <select id="docTopic">
                    <option value="Blueprint">Blueprint</option>
                    <option value="Architecture">Architecture</option>
                    <option value="Manifesto">Manifesto</option>
                    <option value="Protocol">Protocol</option>
                </select>
            </div>

            <div class="form-group">
                <label>Text / Body (Structured Headings & Content)</label>
                <textarea id="docText" placeholder="Write document contents using clear headings and paragraphs..." required></textarea>
            </div>

            <div class="form-group">
                <label>External Link (Optional)</label>
                <input type="text" id="docLink" placeholder="https://...">
            </div>

            <button type="submit" class="btn-publish" id="submitBtn">Publish to Library</button>
        </form>

        <div class="archive-section">
            <h2 style="font-size: 13pt; color: var(--accent-gold); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Managed Content Archive</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTableBody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", loadAdminArchive);

        async function loadAdminArchive() {
            try {
                const res = await fetch('/api/documents');
                const docs = await res.json();
                const tbody = document.getElementById('archiveTableBody');
                tbody.innerHTML = '';

                if (docs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">No documents in archive.</td></tr>';
                    return;
                }

                docs.forEach(doc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong style="color: var(--accent-gold);">${doc.title}</strong></td>
                        <td style="color: var(--text-muted);">${doc.topic}</td>
                        <td class="action-btns">
                            <button class="btn-edit" onclick="editDoc('${doc.id}', '${encodeURIComponent(doc.title)}', '${doc.topic}', '${encodeURIComponent(doc.text)}', '${encodeURIComponent(doc.link || '')}')">Edit</button>
                            <button class="btn-delete" onclick="deleteDoc('${doc.id}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading archive:", err);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;
            const title = document.getElementById('docTitle').value;
            const topic = document.getElementById('docTopic').value;
            const text = document.getElementById('docText').value;
            const link = document.getElementById('docLink').value;

            const payload = { id, title, topic, text, link };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/documents/${id}` : '/api/documents';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    alert("Document successfully saved!");
                    document.getElementById('cmsForm').reset();
                    document.getElementById('docId').value = '';
                    document.getElementById('submitBtn').innerText = 'Publish to Library';
                    loadAdminArchive();
                } else {
                    alert("Failed to save document.");
                }
            } catch (err) {
                alert("Server connection error.");
            }
        }

        function editDoc(id, title, topic, text, link) {
            document.getElementById('docId').value = id;
            document.getElementById('docTitle').value = decodeURIComponent(title);
            document.getElementById('docTopic').value = topic;
            document.getElementById('docText').value = decodeURIComponent(text);
            document.getElementById('docLink').value = decodeURIComponent(link);
            document.getElementById('submitBtn').innerText = 'Update Document';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteDoc(id) {
            if (!confirm("Are you sure you want to delete this document?")) return;
            try {
                const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    loadAdminArchive();
                } else {
                    alert("Failed to delete document.");
                }
            } catch (err) {
                alert("Server connection error.");
            }
        }
    </script>
</body>
</html>
